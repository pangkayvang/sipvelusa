<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velusa Luxury Matcha — Website Mockup</title>

    <!-- Velusa Custom CSS + JS -->
    <link rel="stylesheet" href="velusa.css">
    <script src="velusa.js" defer></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Clicker+Script&family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Brand Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blush: '#F7E0E8',
                        cream: '#FAF5F8',
                        'rose-mid': '#C4909E',
                        'rose-dark': '#9B6B7A',
                        sage: '#A6AE8A',
                        taupe: '#9A8087',
                        offwhite: '#FFFAFB',
                        espresso: '#4A3C37',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-cream text-espresso">

    <!-- HEADER -->
    <header class="velusa-header">
        <img src="logo.png" class="velusa-logo mx-auto" alt="Velusa Logo">
        <h1 class="brand-title">Velusa Luxury Matcha</h1>
    </header>

    <!-- HERO -->
    <section class="hero px-6 py-20 text-center">
        <h2 class="hero-title">Blush‑Cream Artisan Matcha</h2>
        <p class="hero-sub">Handcrafted luxury beverages & desserts</p>
    </section>

    <!-- MENU SECTION -->
    <section class="menu-section">
        <h3 class="section-title">Signature Drinks</h3>

        <div class="menu-grid">

            <!-- CARD 1 -->
            <div class="menu-card">
                <img src="drink1.jpg" class="menu-img" alt="Velusa Blush Matcha">
                <h4 class="menu-name">Velusa Blush Matcha</h4>
                <p class="menu-desc">Creamy blush‑rose matcha with soft vanilla.</p>
            </div>

            <!-- CARD 2 -->
            <div class="menu-card">
                <img src="drink2.jpg" class="menu-img" alt="Emerald Cloud">
                <h4 class="menu-name">Emerald Cloud</h4>
                <p class="menu-desc">Fluffy cold‑foam matcha with emerald tones.</p>
            </div>

            <!-- CARD 3 -->
            <div class="menu-card">
                <img src="drink3.jpg" class="menu-img" alt="Rose Gold Latte">
                <h4 class="menu-name">Rose Gold Latte</h4>
                <p class="menu-desc">Silky rose‑gold espresso with cream.</p>
            </div>

        </div>
    </section>

</body>
</html>
